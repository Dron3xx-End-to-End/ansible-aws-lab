name: Portfiolio notify

on:
  push:
    paths:
      - "portfolio-update.md"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PORTFOLIO_CLIENT_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
      - name: Run notification step
        run: |
          curl -X POST -w "%{http_code}\n" \
          -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Dron3xx-End-to-End/portfolio-automation/dispatches \
          -d @- <<JSON
          {
            "event_type": "project-update",
            "client_payload": {
              "repo_url": "${{ github.repositoryUrl }}"
            }
          }
          JSON
