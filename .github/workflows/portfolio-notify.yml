name: Portfiolio notify

on:
  workflow_dispatch:


jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Run notification step
        run: |
          curl -X POST -w "%{http_code}\n" \
          -H "Authorization: Bearer ${{ secrets.PORTFOLIO_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Dron3xx/portfolio-automation/dispatches \
          -d @- <<JSON
          {
            "event_type": "project-update",
            "client_payload": {
              "repo_url": "${{ github.repositoryUrl }}"
            }
          }
          JSON
